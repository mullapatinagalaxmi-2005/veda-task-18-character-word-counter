<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A live character, word, and sentence counter.">
    <title>Character and Word Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <p class="tag">VEDA TECHNOLOGY · TASK 18</p>
            <h1>Character &amp; Word Counter</h1>
            <p class="subtitle">Write something and watch your text statistics update instantly.</p>
        </header>

        <section class="counter-card">
            <label for="textInput">Enter your text</label>
            <textarea
                id="textInput"
                placeholder="Start typing or paste your text here..."
                spellcheck="true"
            ></textarea>

            <div class="button-row">
                <span id="status" aria-live="polite">Ready to count</span>
                <button id="clearBtn" type="button">Clear Text</button>
            </div>

            <div class="stats">
                <article class="stat-box">
                    <span class="stat-number" id="characters">0</span>
                    <span class="stat-label">Characters</span>
                </article>
                <article class="stat-box">
                    <span class="stat-number" id="charactersNoSpaces">0</span>
                    <span class="stat-label">Without spaces</span>
                </article>
                <article class="stat-box">
                    <span class="stat-number" id="words">0</span>
                    <span class="stat-label">Words</span>
                </article>
                <article class="stat-box">
                    <span class="stat-number" id="sentences">0</span>
                    <span class="stat-label">Sentences</span>
                </article>
            </div>
        </section>

        <footer>
            Built with HTML, CSS and JavaScript
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
